name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 EOL Nisan 2026'da. Glob desteği (--test) Node 21+ ile geldi.
          # Yerel geliştirme de 22.x üzerinde.
          node-version: 22.x
          cache: 'npm'

      # Pure-JS unit testler için native bağımlılıkları (canvas, sqlite3)
      # derlemeye gerek yok; postinstall script'lerini atlıyoruz.
      - name: Install dependencies (skip native builds)
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      # Arayüz derlemesi (JSX → JS + yerel kütüphaneler): JSX sözdizimi hatası
      # ve eksik kütüphane burada yakalanır, eczaneye kurulan pakette değil.
      - name: Build UI (JSX derleme + vendor)
        run: npm run build:ui

  # Windows paketleme provası: native modül (sqlite3) + electron-builder yapılandırması
  # gerçekten paketleniyor mu? Kurulum dosyası üretmez (--dir), imza gerektirmez.
  package-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies (native builds included)
        run: npm ci
      # web/ git'te yok (derleme çıktısı); electron-builder doğrudan çağrıldığında
      # "prebuild" koşmaz — arayüz derlenmezse paket boş ekranla açılır.
      - name: Build UI (JSX derleme + vendor)
        run: npm run build:ui
      - name: Package (unpacked dir)
        run: npx electron-builder --win --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify package contents
        shell: bash
        run: |
          set -e
          ls dist/win-unpacked
          test -f "dist/win-unpacked/Soguk Zincir Otomasyon.exe"
          # Windows'ta asar yolları "\app.html" biçiminde listelenir: "/" ile normalleştir
          npx @electron/asar list dist/win-unpacked/resources/app.asar | tr '\134' '/' | tr -d '\r' > asar-list.txt
          for f in /app.html /web/ui/cr-app.js /web/ui/cr-bexflow.js /web/vendor/react.min.js /auth.js /bexflow-service.js; do
            grep -qx "$f" asar-list.txt || { echo "Pakette eksik: $f"; exit 1; }
          done
          if grep -E "^/(tests|scripts|\.env|coldchain\.db|ui/cr-app\.jsx)" asar-list.txt; then echo "Pakete girmemesi gereken dosya var"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: dist/win-unpacked
          retention-days: 7
