<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColdChain AI — Kontrol Odası</title>
  <!-- Fontlar yerel (web/vendor/fonts.css — scripts/build-ui.js üretir); CDN yok -->
  <link href="web/vendor/fonts.css" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0e14; overflow: hidden; }
    * { -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; width: 100vw; }
    .cc-boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0a0e14;
      color: #46b6da; font-family: 'Space Grotesk', sans-serif; z-index: 999; transition: opacity .35s; }
    .cc-boot.hide { opacity: 0; pointer-events: none; }
    .cc-boot .ring { width: 38px; height: 38px; border: 3px solid rgba(70,182,218,.25); border-top-color: #46b6da;
      border-radius: 50%; animation: ccspin .8s linear infinite; }
    @keyframes ccspin { to { transform: rotate(360deg); } }
    .cc-boot .lbl { margin-top: 16px; font-size: 13px; letter-spacing: .5px; color: rgba(255,255,255,.6); }
  </style>
</head>
<body data-app-theme="dark">
  <div id="root"></div>
  <div id="print-root"></div>
  <div class="cc-boot" id="ccBoot"><div style="text-align:center"><div class="ring"></div><div class="lbl">ColdChain AI yükleniyor…</div></div></div>

  <!-- Üçüncü taraf kütüphaneler: YEREL (web/vendor, scripts/build-ui.js üretir).
       Hiçbir CDN bağımlılığı yok; arayüz internetsiz / proxy arkasında da açılır.
       Sürümler: web/vendor/VERSIONS.json -->
  <script src="web/vendor/xlsx.full.min.js" onerror="window.__ccVendorMissing = true"></script>
  <script src="web/vendor/pdf.min.js" onerror="window.__ccVendorMissing = true"></script>
  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'web/vendor/pdf.worker.min.js';
  </script>
  <script src="web/vendor/react.min.js" onerror="window.__ccVendorMissing = true"></script>
  <script src="web/vendor/react-dom.min.js" onerror="window.__ccVendorMissing = true"></script>

  <!-- Analiz motorları (mevcut backend ile aynı çekirdek) -->
  <script src="date-format-detector.js"></script>
  <script src="js/confidence.js"></script>
  <script src="js/evidence-check.js"></script>
  <script src="js/format-fingerprint.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mkt-engine.js"></script>
  <script src="js/smart-parser.js"></script>
  <script src="js/data-parser.js"></script>
  <script src="js/ai-vision.js"></script>
  <script src="js/drug-formulary.js"></script>
  <script src="js/decision-engine.js"></script>

  <!-- Kontrol Odası veri katmanı -->
  <script src="ui/cc-data.js"></script>
  <script src="ui/cr-scenarios.js"></script>
  <script src="ui/cc-store.js"></script>
  <script src="ui/cc-settings.js"></script>
  <script src="ui/cc-pipeline.js"></script>

  <!-- Kontrol Odası arayüzü: ui/*.jsx → web/ui/*.js (önceden derlenmiş; tarayıcıda Babel yok).
       Kaynak ui/ altında; "npm run build:ui" (veya geliştirmede "npm run dev:ui") derler. -->
  <script src="web/ui/cc-shared.js"></script>
  <script src="web/ui/dir-controlroom.js"></script>
  <script src="web/ui/cr-scan.js"></script>
  <script src="web/ui/cr-decisionchart.js"></script>
  <script src="web/ui/cr-pdfpreview.js"></script>
  <script src="web/ui/cr-login.js"></script>
  <script src="web/ui/cr-upload.js"></script>
  <script src="web/ui/cr-analysis.js"></script>
  <script src="web/ui/cr-export.js"></script>
  <script src="web/ui/cr-report.js"></script>
  <script src="web/ui/cr-settings.js"></script>
  <script src="web/ui/cr-templates.js"></script>
  <script src="web/ui/cr-audit.js"></script>
  <script src="web/ui/cr-app.js"></script>

  <script>
    (function () {
      var tries = 0;
      var start = function () {
        if (window.CRApp && window.CRShell && window.React && window.ReactDOM) {
          ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.CRApp));
          var boot = document.getElementById('ccBoot');
          if (boot) { boot.classList.add('hide'); setTimeout(function () { boot.remove(); }, 400); }
          return;
        }
        if (++tries > 100 || window.__ccVendorMissing) {
          // Derlenmemiş kurulum: sonsuz spinner yerine ne yapılacağını söyle
          var lbl = document.querySelector('#ccBoot .lbl');
          if (lbl) lbl.innerHTML = 'Arayüz dosyaları bulunamadı (web/ klasörü yok).<br>Proje dizininde <code>npm run build:ui</code> çalıştırıp sayfayı yenileyin.';
          var ring = document.querySelector('#ccBoot .ring');
          if (ring) ring.style.display = 'none';
          return;
        }
        setTimeout(start, 30);
      };
      start();
    })();
  </script>
</body>
</html>
